<!-- Title -->
<section>
    <h2>GRS Geospatial Portal</h2>
    <p>Interactive maps for soil, environment, and natural resources analysis.</p>
</section>

<!-- MAP CONTAINER -->
<div id="map" style="height: 600px; margin: 20px;"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    // Initialize map (center: Cameroon)
    var map = L.map('map').setView([3.848, 11.502], 6);

    // Base map
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Example marker (Yaoundé)
    L.marker([3.848, 11.502])
        .addTo(map)
        .bindPopup("GRS Head Office - Yaoundé")
        .openPopup();
</script>

</body>
